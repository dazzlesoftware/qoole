; Grid server configuration, as OpenSim's Robust.ini.
; Run: GenesisGridServer.exe -config=Samples/GridServer/GridServer.ini [-save]
; Paths are relative to this file.

[GridServer]
; The project whose content holds the world registry and the region maps.
Project = ../../MyGame/MyGame.gproject
; The Genesis.WorldComposition registry (Content Browser > Add > World Composition).
World = /Game/Worlds/Main
; Region files, one [Region Name] section per region.
Regions = Regions
; Write registrations back to the world registry (the -save switch does the same).
SaveWorld = false

[GridService]
; Regions the registry does not list may register themselves.
AutoRegistration = true
; Auto-registered regions leave the map when their server unregisters.
DeleteOnUnregister = true
; Region_<Name or RegionUUID> = DefaultRegion, FallbackRegion, NoDirectLogin,
;                               Persistent, LockedOut, NoMove
Region_Hills = "DefaultRegion, NoMove"
Region_Coast = FallbackRegion
